name: minesweeper_online
description: A new Flutter project.
publish_to: none

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_context_menu_web:
    git:
      url: https://github.com/D10100111001/flutter_context_menu_web.git
      ref: master
  # flutter_local_storage:
  #   git: https://github.com/D10100111001/flutter_local_storage
  provider: ^6.1.5
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  audioplayers: ^6.5.1
  path_provider: ^2.1.5
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  build_runner: ^2.4.13


flutter:
  uses-material-design: true

  assets:
    - assets/audio/click.mp3
    - assets/audio/opening.mp3
    - assets/audio/flag.mp3
    - assets/audio/win.mp3
    - assets/audio/explode.mp3
    - assets/audio/lose.mp3

  fonts:
    - family: Minesweeper
      fonts:
        - asset: fonts/mine-sweeper.ttf
    - family: Raleway
      fonts:
        - asset: fonts/Raleway-Regular.ttf
        - asset: fonts/Raleway-Italic.ttf
          style: italic
